[project]
name = "abstract-analyzer-backend"
version = "0.1.0"
description = "FastAPI backend for the abstract submission & clustering platform"
authors = [
    { name = "djamal2905", email = "djamaltoe012@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "hdbscan>=0.8.44",
    "optuna>=4.9.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "sentence-transformers>=5.7.0",
    "sqlalchemy>=2.0.52",
    "transformers>=5.15.0",
    "umap-learn>=0.5.12",
    "uvicorn>=0.52.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
